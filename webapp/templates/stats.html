{% extends "base.html" %}
{% block title %}统计报表 - 安全帽/口罩佩戴检测系统{% endblock %}
{% block pagetitle %}统计报表{% endblock %}
{% block content %}
<div class="stat-grid">
  <div class="card stat"><div class="stat-ico ico-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></div><div><div class="num" id="sTotal">-</div><div class="lbl">检测记录总数</div></div></div>
  <div class="card stat"><div class="stat-ico ico-green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-8"/></svg></div><div><div class="num" id="sObjects">-</div><div class="lbl">检出目标总数</div></div></div>
  <div class="card stat"><div class="stat-ico ico-red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 2.5 20h19L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg></div><div><div class="num" id="sViol">-</div><div class="lbl">违规目标数</div></div></div>
  <div class="card stat"><div class="stat-ico ico-cyan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div><div><div class="num" id="sToday">-</div><div class="lbl">今日新增记录</div></div></div>
</div>

<div class="card">
  <h3 class="card-title">近 14 天检测趋势</h3>
  <div class="chart" id="chDaily"></div>
</div>
<div class="grid-2">
  <div class="card">
    <h3 class="card-title">目标类别分布</h3>
    <div class="chart" id="chClasses"></div>
  </div>
  <div class="card">
    <h3 class="card-title">检测来源占比</h3>
    <div class="chart" id="chSources"></div>
  </div>
</div>
<div class="card">
  <h3 class="card-title">平均置信度分布</h3>
  <div class="chart" id="chConf"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
/* 图表配色统一从 CSS 变量取「快照」：
   ECharts 只认具体色值、不认 var()，所以这里先读出来再喂进去。
   好处是配色只在 style.css 维护一份，两套主题各改各的；
   收到 themechange 事件时重新读一遍并 setOption，即可整页换色。 */
function themePalette() {
  const cs = getComputedStyle(document.documentElement);
  const v = (name, fallback) => (cs.getPropertyValue(name) || '').trim() || fallback;
  return {
    accent: v('--chart-accent', '#1aacc0'),
    ok:     v('--chart-ok', '#34d399'),
    bad:    v('--chart-bad', '#f87171'),
    warn:   v('--chart-warn', '#fbbf24'),
    cyan:   v('--chart-cyan', '#67e8f9'),
    gray:   v('--chart-gray', '#64718a'),
    violet: v('--chart-violet', '#a78bfa'),
    axis:   v('--chart-axis', '#2c3244'),
    split:  v('--chart-split', '#1b1f2b'),
    label:  v('--chart-label', '#819aab'),
    legend: v('--chart-legend', '#a8bccd'),
    area:   v('--sel-bg', 'rgba(26,172,192,.16)'),
    bar:    v('--accent-soft', '#0a3b45')
  };
}

let CHARTS = [];
let STATS_DATA = null;

function renderCharts() {
  if (!STATS_DATA) return;
  const d = STATS_DATA;
  const P = themePalette();
  const ACCENT = P.accent, OK = P.ok, BAD = P.bad, CYAN = P.cyan;
  const axisStyle = {axisLine:{lineStyle:{color:P.axis}}, axisLabel:{color:P.label}, splitLine:{lineStyle:{color:P.split}}};
  const LEGEND = {color: P.legend};

  // 趋势
  const daily = echarts.init(document.getElementById('chDaily'));
  daily.setOption({
    color: [ACCENT, OK, BAD],
    tooltip: {trigger: 'axis'},
    legend: {data: ['检测记录数', '检出目标数', '违规目标数'], textStyle: LEGEND},
    grid: {left: 48, right: 20, top: 40, bottom: 30},
    xAxis: {type: 'category', data: d.daily.map(x => x.date), ...axisStyle},
    yAxis: {type: 'value', ...axisStyle},
    series: [
      {name: '检测记录数', type: 'line', smooth: true, data: d.daily.map(x => x.records), itemStyle: {color: ACCENT}, areaStyle: {color: P.area}},
      {name: '检出目标数', type: 'line', smooth: true, data: d.daily.map(x => x.objects), itemStyle: {color: OK}},
      {name: '违规目标数', type: 'line', smooth: true, data: d.daily.map(x => x.violations), itemStyle: {color: BAD}}
    ]
  }, true);

  // 类别分布
  const cls = echarts.init(document.getElementById('chClasses'));
  const clsData = Object.entries(d.classes).filter(([k, v]) => v > 0)
    .map(([k, v]) => ({name: k, value: v}));
  cls.setOption({
    // 调色板必须放在 option 顶层：放进 series 里 ECharts 不识别，
    // 会静默回退到默认配色（蓝/红），图例与扇区都会串色。
    color: [OK, BAD, CYAN, P.warn],
    tooltip: {trigger: 'item'},
    legend: {bottom: 0, textStyle: LEGEND},
    series: [{
      type: 'pie', radius: ['42%', '68%'], center: ['50%', '44%'],
      label: {color: P.label},
      data: clsData.length ? clsData : [{name: '暂无数据', value: 0}]
    }]
  }, true);

  // 来源占比
  const src = echarts.init(document.getElementById('chSources'));
  const srcData = Object.entries(d.sources).filter(([k, v]) => v > 0)
    .map(([k, v]) => ({name: k, value: v}));
  src.setOption({
    color: [ACCENT, CYAN, P.violet],
    tooltip: {trigger: 'item'},
    legend: {bottom: 0, textStyle: LEGEND},
    series: [{
      type: 'pie', radius: '62%', center: ['50%', '44%'],
      label: {color: P.label, formatter: '{b}: {c}'},
      data: srcData.length ? srcData : [{name: '暂无数据', value: 0}]
    }]
  }, true);

  // 置信度分布
  const conf = echarts.init(document.getElementById('chConf'));
  conf.setOption({
    tooltip: {trigger: 'axis'},
    grid: {left: 48, right: 20, top: 30, bottom: 30},
    xAxis: {type: 'category', data: d.conf.map(x => x.label), ...axisStyle},
    yAxis: {type: 'value', ...axisStyle},
    series: [{type: 'bar', barWidth: '46%', data: d.conf.map(x => x.count), itemStyle: {color: ACCENT, borderRadius: [6, 6, 0, 0]}}]
  }, true);

  CHARTS = [daily, cls, src, conf];
  window.addEventListener('resize', () => CHARTS.forEach(c => c.resize()));
}

(async () => {
  const d = await (await fetch('/api/stats')).json();
  STATS_DATA = d;
  document.getElementById('sTotal').textContent = d.summary.total_records;
  document.getElementById('sObjects').textContent = d.summary.total_objects;
  document.getElementById('sViol').textContent = d.summary.violations;
  document.getElementById('sToday').textContent = d.summary.today_records;
  renderCharts();
})();

/* 切换主题时用同一份数据重绘，不必重新请求接口 */
window.addEventListener('themechange', () => renderCharts());
</script>
{% endblock %}
